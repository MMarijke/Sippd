name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Edge functions are Deno code outside the Vite build: parse them here
      # so a syntax error fails the PR, not Supabase's bundling after merge.
      - run: npm run check:functions

      - run: npm run build

      - run: npm run test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default shallow clone -- a secret committed
      # 50 commits ago and never removed is still a leak; a shallow clone
      # would only ever see the current diff.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Raw MIT-licensed CLI binary, not the gitleaks-action wrapper --
      # the wrapper's free tier only covers personal-account repos outright;
      # an org repo needs a license key. The CLI itself has no such
      # restriction regardless of account type, so this avoids the question
      # entirely rather than depending on it staying personal-account-owned.
      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan for secrets
        run: gitleaks detect --source . --verbose --redact

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Placeholders, not real credentials -- e2e/smoke.spec.js mocks every
      # Supabase call at the network layer before it can reach any server,
      # so this build never touches the linked project. supabaseClient.js
      # just throws at import time if these are unset at all.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://e2e-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: e2e-placeholder-anon-key
          # Same for Paddle: e2e/subscription.spec.js serves a fake Paddle.js and
          # checks checkout is opened with these exact (made-up) values.
          VITE_PADDLE_ENVIRONMENT: sandbox
          VITE_PADDLE_CLIENT_TOKEN: test_e2e_token
          VITE_PADDLE_MONTHLY_PRICE_ID: pri_e2e_monthly
          VITE_PADDLE_ANNUAL_PRICE_ID: pri_e2e_annual

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
