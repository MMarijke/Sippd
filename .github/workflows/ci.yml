name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm run test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default shallow clone -- a secret committed
      # 50 commits ago and never removed is still a leak; a shallow clone
      # would only ever see the current diff.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Raw MIT-licensed CLI binary, not the gitleaks-action wrapper --
      # the wrapper's free tier only covers personal-account repos outright;
      # an org repo needs a license key. The CLI itself has no such
      # restriction regardless of account type, so this avoids the question
      # entirely rather than depending on it staying personal-account-owned.
      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan for secrets
        run: gitleaks detect --source . --verbose --redact

  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships Docker preinstalled, which is what `db start`
      # needs to spin up a disposable local Postgres seeded from
      # supabase/migrations/*. Nothing here touches the linked project --
      # no project ref, no login, no secrets. See supabase/tests/*.sql for
      # the RLS/RPC cross-account isolation and column-lock trigger tests
      # this actually runs.
      # Pinned: "latest" makes setup-cli ask the GitHub API for the newest
      # release on every run, unauthenticated, and that call gets rate
      # limited ("Failed to resolve latest Supabase CLI release"). Matches
      # the CLI version used locally; bump deliberately.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      # Once failed with "failed to bind host port for 0.0.0.0:54322: address
      # already in use" on a fresh runner, where nothing else should hold
      # that port. Suspected: a race inside `db start` (Docker not yet
      # releasing the port from the CLI's own first attempt). Not proven, so
      # this logs what holds the port, then retries ONCE after a clean stop.
      # A retry that passes is still printed loudly, so a recurring flake
      # stays visible rather than silently absorbed.
      - name: Start local database
        run: |
          if supabase db start; then exit 0; fi
          echo "::warning::supabase db start failed once; diagnostics follow, then one retry"
          sudo ss -ltnp | grep -E ':5432[0-9]' || echo "nothing listening on 5432x"
          docker ps -a --format '{{.Names}}\t{{.Status}}\t{{.Ports}}'
          supabase stop --no-backup || true
          sleep 5
          supabase db start

      - run: supabase test db

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Placeholders, not real credentials -- e2e/smoke.spec.js mocks every
      # Supabase call at the network layer before it can reach any server,
      # so this build never touches the linked project. supabaseClient.js
      # just throws at import time if these are unset at all.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://e2e-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: e2e-placeholder-anon-key

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
