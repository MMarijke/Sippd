<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Generated from resources/icon-source.jpg by scripts/generate-icons.mjs. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Static fallback = Power-Up's background (the free default theme);
         useTheme.js keeps this in sync with whichever theme is actually
         active on every change. -->
    <meta name="theme-color" content="#0B1018" />
    <!-- Paint this device's last theme before the app loads, instead of
         Power-Up until the profile answers. Same key and shape as
         src/lib/themeCache.js; useTheme.js takes over once it mounts. -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('sippd-theme') || 'null');
        if (t && typeof t.theme === 'string' && typeof t.polarity === 'string') {
          var d = document.documentElement.dataset;
          d.theme = t.theme;
          d.polarity = t.polarity;
          if (t.tone) d.tone = t.tone;
          if (t.background) document.querySelector('meta[name="theme-color"]').setAttribute('content', t.background);
        }
      } catch (e) {}
    </script>
    <link rel="manifest" href="/manifest.json" />
    <title>Sippd: Can Collection Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
