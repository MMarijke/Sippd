<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#08080c" />
    <title>Sippd: offline</title>
    <!-- Shown only when the service worker can't serve the app shell (a
         navigation before its first install finished). Self-contained: no
         app code, fonts or network. -->
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        padding: 0 16px; box-sizing: border-box;
        background: #08080c; color: #f2f2f5;
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main { max-width: 22rem; text-align: center; }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 1.5rem; color: #a9a9b4; }
      button {
        min-height: 44px; padding: 0 1.25rem; border: 0; border-radius: 10px;
        background: #f2f2f5; color: #08080c; font: inherit; font-weight: 600;
      }
      button:focus-visible { outline: 2px solid #f2f2f5; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Sippd hasn't finished saving itself for offline use on this device yet. Reconnect once and it will open without a connection from then on.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
